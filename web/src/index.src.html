<title>מטרופולין שוק ההון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: a white clay diorama city on lavender asphalt, full bleed, under floating white glass chrome.
   Right rail = districts or holdings, left column = camera, bottom = view modes + legend.
   The company card docks left on desktop and rises as a sheet on phones; the camera view offset
   keeps the chosen building centred in the part of the city that stays visible. */
:root{
  --sky:#EDEFF8; --asphalt:#C6CDE4; --lane:#FFFFFF; --walk:#FAFBFE; --lot:#F1F3FA; --clay:#FFFFFF; --water:#B9D4F0; --shallow:#CFE2F6; --sand:#F5F0E6;
  --tree:#F4F5FB; --trunk:#CDD2E2; --car:#FFFFFF;
  --ink:#18203A; --ink-2:#4E5875; --ink-3:#8790A9;
  --glass:rgba(252,252,255,.84); --glass-strong:rgba(255,255,255,.97);
  --line:rgba(24,32,58,.09); --line-2:rgba(24,32,58,.17);
  --accent:#3554F0; --accent-ink:#FFFFFF; --accent-soft:rgba(53,84,240,.11);
  --up:#0C9E78; --down:#E4474E; --cheap:#0E9AA3; --beacon:#EFA215; --warn:#B66C08;
  --up-soft:rgba(12,158,120,.12); --down-soft:rgba(228,71,78,.11); --warn-soft:rgba(182,108,8,.12);
  --shadow:0 18px 40px -14px rgba(40,48,92,.30), 0 2px 6px rgba(40,48,92,.06);
  --font-ui:"IBM Plex Sans Hebrew","Noto Sans Hebrew","Arial Hebrew",system-ui,sans-serif;
  --font-data:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --gx-l:max(16px, env(safe-area-inset-left, 0px)); --gx-r:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(14px + env(safe-area-inset-top, 0px)); --gb:calc(14px + env(safe-area-inset-bottom, 0px));
  --pw:452px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#13122B; --asphalt:#1E1C43; --lane:#57539C; --walk:#26244F; --lot:#211F49; --clay:#7471B4; --water:#0C1433; --shallow:#142050; --sand:#2B2A55;
  --tree:#2E2B63; --trunk:#3B3878; --car:#CFCBFF;
  --ink:#EEEDFF; --ink-2:#AFACD8; --ink-3:#7B78AE;
  --glass:rgba(30,28,64,.82); --glass-strong:rgba(34,32,72,.97);
  --line:rgba(238,237,255,.10); --line-2:rgba(238,237,255,.19);
  --accent:#95A6FF; --accent-ink:#121131; --accent-soft:rgba(149,166,255,.16);
  --up:#41DB9C; --down:#FF6072; --cheap:#46D0D7; --beacon:#FFCF5C; --warn:#F0A43A;
  --up-soft:rgba(65,219,156,.14); --down-soft:rgba(255,96,114,.15); --warn-soft:rgba(240,164,58,.15);
  --shadow:0 18px 44px -14px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --sky:#13122B; --asphalt:#1E1C43; --lane:#57539C; --walk:#26244F; --lot:#211F49; --clay:#7471B4; --water:#0C1433; --shallow:#142050; --sand:#2B2A55;
  --tree:#2E2B63; --trunk:#3B3878; --car:#CFCBFF;
  --ink:#EEEDFF; --ink-2:#AFACD8; --ink-3:#7B78AE;
  --glass:rgba(30,28,64,.82); --glass-strong:rgba(34,32,72,.97);
  --line:rgba(238,237,255,.10); --line-2:rgba(238,237,255,.19);
  --accent:#95A6FF; --accent-ink:#121131; --accent-soft:rgba(149,166,255,.16);
  --up:#41DB9C; --down:#FF6072; --cheap:#46D0D7; --beacon:#FFCF5C; --warn:#F0A43A;
  --up-soft:rgba(65,219,156,.14); --down-soft:rgba(255,96,114,.15); --warn-soft:rgba(240,164,58,.15);
  --shadow:0 18px 44px -14px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.25); color-scheme:dark; }
:root.cb{ --up:#2B78D6; --down:#E9861C; --up-soft:rgba(43,120,214,.13); --down-soft:rgba(233,134,28,.14); }

html,body{height:100%; margin:0}
[hidden]{display:none !important}
body{background:var(--sky); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.45; overflow:hidden; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{direction:ltr; unicode-bidi:isolate; font-family:var(--font-data); font-variant-numeric:tabular-nums; letter-spacing:.01em}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--ink-3)} .warn{color:var(--warn)}
.glass{background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4); border:1px solid var(--line); box-shadow:var(--shadow)}

#app{position:fixed; inset:0; overflow:hidden}
#scene{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none}
#leaders{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:1}
#leaders line{stroke:var(--ink-2); stroke-width:1.2; opacity:.55}
#leaders circle{fill:var(--glass-strong); stroke:var(--ink-2); stroke-width:1.5}
#leaders line.ac{stroke:var(--accent); opacity:.9} #leaders circle.ac{stroke:var(--accent); fill:var(--accent)}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2; isolation:isolate}
.lab{position:absolute; left:0; top:0; will-change:transform; white-space:nowrap}

/* ---------- scene labels ---------- */
.isl{z-index:3; pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px; border-radius:15px; background:var(--glass-strong); border:1px solid var(--line); box-shadow:var(--shadow); transition:opacity .25s; white-space:nowrap}
.isl .em{flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff}
.isl b{display:block; font-size:14.5px; font-weight:700; line-height:1.15}
.isl small{display:block; font-size:11px; color:var(--ink-3); line-height:1.2}
.isl .v{font-size:12.5px; font-weight:600; margin-inline-start:6px}
.isl.on{outline:2px solid var(--accent)}
.isl.sm{padding:4px 10px 4px 4px; gap:7px} .isl.sm small,.isl.sm .v{display:none} .isl.sm .em{width:26px; height:26px; border-radius:8px} .isl.sm b{font-size:13px}
.dlab{z-index:3; pointer-events:auto; cursor:pointer; display:flex; align-items:center; gap:8px; padding:5px 10px 5px 8px; border-radius:11px; font-size:13px; font-weight:600; background:var(--glass-strong); border:1px solid var(--line); box-shadow:0 8px 20px -10px rgba(40,48,92,.45); transition:opacity .25s}
.dlab i{width:10px; height:10px; border-radius:3px; flex:none}
.dlab .num{font-size:12px; font-weight:600}
.dlab.on{outline:2px solid var(--accent)}
.tk{z-index:1; direction:ltr; font-family:var(--font-data); font-size:11.5px; font-weight:600; color:var(--ink); padding:1px 6px; border-radius:6px; background:var(--glass-strong); border:1px solid var(--line); line-height:16px}
.tk i{font-style:normal; font-weight:500; margin-left:5px; color:var(--ink-2)}
.tk i.up{color:var(--up)} .tk i.down{color:var(--down)}
.st{z-index:1; font-size:10.5px; font-weight:600; color:var(--ink-2); letter-spacing:.02em; direction:ltr; padding:1px 7px; border-radius:6px; background:color-mix(in srgb, var(--glass-strong) 82%, transparent); border:1px solid var(--line)}
.pin{z-index:2; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-data); font-weight:700; font-size:11.5px; color:var(--accent-ink); background:var(--accent); border:2px solid var(--glass-strong); box-shadow:0 4px 10px -3px rgba(0,0,0,.35)}
.pin.hold{background:var(--beacon); color:#2A1C00}
/* anchored callout cards, in the style of the references */
.co{z-index:4; pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; transition:opacity .2s}
.co .card{transform:translateX(var(--dx, 0px)); display:flex; align-items:center; gap:10px; padding:8px 12px 8px 10px; border-radius:16px; background:var(--glass-strong); border:1px solid var(--line); box-shadow:var(--shadow); min-width:180px; max-width:290px}
.co .tile{flex:none; width:36px; height:36px; border-radius:11px; display:grid; place-items:center; color:#fff; background:var(--accent)}
.co .tile.dn{background:var(--down)} .co .tile.bc{background:var(--beacon); color:#2A1C00} .co .tile.wr{background:var(--warn)} .co .tile.up{background:var(--up)}
.co b{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; font-size:13.5px; font-weight:600; line-height:1.3; white-space:normal}
.co .chips{display:flex; gap:4px; margin-top:3px; flex-wrap:wrap}
.co .chips span{font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--accent-soft); color:var(--accent)}
.co .chips span.dn{background:var(--down-soft); color:var(--down)} .co .chips span.up{background:var(--up-soft); color:var(--up)} .co .chips span.wr{background:var(--warn-soft); color:var(--warn)}
.co .stem{width:1.5px; height:34px; background:var(--ink-3); opacity:.6}
.co .dot{width:9px; height:9px; border-radius:50%; background:var(--glass-strong); border:2px solid var(--ink-2); margin-top:-1px}
.co.small .card{min-width:0; padding:5px 9px 5px 7px; gap:7px; border-radius:12px}
.co.small .tile{width:22px; height:22px; border-radius:7px}
.co.small b{font-size:12px}
.co.small .stem{height:20px}

/* hover card */
.hcard{position:absolute; z-index:5; left:0; top:0; width:256px; padding:12px 14px; border-radius:16px; pointer-events:auto; transition:opacity .15s}
.hcard .h1{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.hcard .tkr{font-family:var(--font-data); font-weight:700; font-size:18px}
.hcard .nm{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px}
.kv3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px}
.kv3 div{display:flex; flex-direction:column; min-width:0}
.kv3 span{font-size:11px; color:var(--ink-3)}
.kv3 b{font-size:13.5px; font-weight:600}
.cta{display:flex; width:100%; height:34px; align-items:center; justify-content:center; border-radius:11px; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:600}
.cta:hover{filter:brightness(1.08)}

/* ---------- chrome ---------- */
#ui{position:fixed; inset:0; z-index:6; pointer-events:none; padding-left:var(--gx-l); padding-right:var(--gx-r); padding-block:var(--gt) var(--gb);
  display:grid; grid-template-columns:300px minmax(0,1fr) auto; grid-template-rows:auto minmax(0,1fr) auto; gap:14px; grid-template-areas:"top top top" "rail . side" "foot foot foot"}
#ui > *{pointer-events:auto}
.top{grid-area:top; display:flex; align-items:center; gap:10px; min-width:0; pointer-events:none}
.top > *{pointer-events:auto}
.brand{display:flex; align-items:center; gap:11px; padding:8px 16px 8px 12px; border-radius:16px}
.brand b{display:block; font-size:18px; font-weight:700; letter-spacing:-.01em; line-height:1.1}
.brand small{display:block; font-size:11.5px; color:var(--ink-3); line-height:1.2}
.strip{display:flex; align-items:center; gap:2px; padding:5px; border-radius:16px; min-width:0; overflow:hidden}
.stat{display:flex; flex-direction:column; padding:3px 12px; white-space:nowrap; border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat span{font-size:11px; color:var(--ink-3); line-height:1.15}
.stat b{font-size:13.5px; font-weight:600; line-height:1.3}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ink-3); margin-inline-end:6px; vertical-align:1px}
.dot.ok,.dot.open{background:var(--up); box-shadow:0 0 0 3px var(--up-soft)} .dot.pre,.dot.post,.dot.stale,.dot.never{background:var(--warn)} .dot.error{background:var(--down)}
.top .spacer{flex:1}
.actions{display:flex; gap:8px; align-items:center}
.btn{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 13px; border-radius:13px; font-size:13.5px; font-weight:500; transition:background .15s; position:relative; white-space:nowrap}
@media (max-width: 1400px){ .btn kbd{display:none} .stat:nth-child(5){display:none} }
@media (max-width: 1240px){ #briefBtn .lbl,#tlBtn .lbl{display:none} #briefBtn,#tlBtn{width:40px; padding:0; justify-content:center} .brand small{display:none} }
.btn:hover{background:var(--accent-soft)}
.btn.icon{width:40px; padding:0; justify-content:center}
.btn kbd{font-family:var(--font-data); font-size:11px; color:var(--ink-3); border:1px solid var(--line-2); border-radius:5px; padding:0 5px; line-height:17px}
.badge{position:absolute; top:4px; left:4px; min-width:17px; height:17px; padding:0 4px; border-radius:99px; background:var(--down); color:#fff; font-family:var(--font-data); font-size:11px; font-weight:700; display:grid; place-items:center}
.modechip{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap}
.modechip.demo{color:var(--warn); background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent)}
.modechip.live{color:var(--up); background:var(--up-soft); border:1px solid color-mix(in srgb, var(--up) 30%, transparent)}

.rail{grid-area:rail; align-self:start; border-radius:20px; display:flex; flex-direction:column; max-height:100%; min-height:0; overflow:hidden}
.rail header{padding:14px 16px 8px; display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.rail h2{margin:0; font-size:15px; font-weight:600}
.rail header small{font-size:11.5px; color:var(--ink-3)}
.rail ol{list-style:none; margin:0; padding:0 6px 6px; overflow:auto; min-height:0}
.rail footer{padding:8px 16px 12px; font-size:11px; color:var(--ink-3); border-top:1px solid var(--line)}
.drow .swi{width:22px; height:22px; border-radius:7px; display:grid; place-items:center; color:#fff}
.drow{display:grid; grid-template-columns:22px minmax(0,1fr) auto; grid-template-rows:auto auto; column-gap:10px; row-gap:5px; align-items:center; width:100%; padding:8px 10px; border-radius:11px; text-align:start}
.drow:hover,.drow.on{background:var(--accent-soft)}
.drow .sw{width:10px; height:10px; border-radius:3px}
.drow .nm{font-weight:500; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.drow .nm em{font-style:normal; font-family:var(--font-data); font-size:11px; color:var(--ink-3); margin-inline-start:6px}
.drow .v{font-size:13px; font-weight:600}
.drow .br{grid-column:2 / 4; height:4px; border-radius:2px; background:var(--down-soft); overflow:hidden; position:relative}
.drow .br i{position:absolute; inset-block:0; inset-inline-start:0; background:var(--up); border-radius:2px}
.hrow{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:4px 10px; align-items:center; width:100%; padding:8px 10px; border-radius:11px; text-align:start}
.hrow:hover{background:var(--accent-soft)}
.hrow .t{font-family:var(--font-data); font-weight:700; font-size:14px}
.hrow .w{height:5px; border-radius:3px; background:var(--line); position:relative; overflow:hidden}
.hrow .w i{position:absolute; inset-block:0; inset-inline-start:0; background:var(--accent); border-radius:3px}
.hrow .meta{grid-column:1 / 4; display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; font-size:11.5px; color:var(--ink-3)}
.pfsum{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 12px 8px}
.pfsum div{display:flex; flex-direction:column; padding:7px 9px; border-radius:10px; background:color-mix(in srgb, var(--ink) 4%, transparent); min-width:0}
.pfsum span{font-size:11px; color:var(--ink-3)} .pfsum b{font-size:13.5px; font-weight:600; white-space:nowrap}
.expo{padding:4px 16px 12px}
.expo .bar{display:flex; height:10px; border-radius:5px; overflow:hidden; margin:6px 0}
.expo .bar i{display:block; height:100%}
.expo .keys{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11.5px; color:var(--ink-2)}
.expo .keys span{display:inline-flex; gap:5px; align-items:center}
.expo .keys span::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--c)}

.side{grid-area:side; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; min-height:0; gap:12px; pointer-events:none}
.side > *{pointer-events:auto}
.cam{display:flex; flex-direction:column; border-radius:15px; padding:4px; gap:2px}
.cam button{width:40px; height:40px; border-radius:11px; display:grid; place-items:center; color:var(--ink-2); font-family:var(--font-data); font-weight:600; font-size:12.5px}
.cam button:hover{background:var(--accent-soft); color:var(--ink)}
.cam button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.cam hr{border:0; height:1px; background:var(--line); margin:2px 6px}

.foot{grid-area:foot; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:end; gap:14px; pointer-events:none; min-width:0; transition:margin-left .45s cubic-bezier(.2,.8,.2,1)}
.foot > *{pointer-events:auto}
#ui.panel-open .foot{margin-left:calc(var(--pw) + 14px); display:flex}
#ui.panel-open .side{visibility:hidden}
.modes{grid-column:2; display:flex; gap:2px; padding:5px; border-radius:18px; margin-inline:auto; min-width:0}
.mode{display:flex; flex-direction:column; align-items:flex-start; padding:7px 16px 8px; border-radius:13px; min-width:118px; transition:background .18s, color .18s; text-align:start}
.mode b{font-size:14px; font-weight:600}
.mode small{font-size:11.5px; color:var(--ink-3)}
.mode:hover{background:var(--accent-soft)}
.mode[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.mode[aria-pressed="true"] small{color:color-mix(in srgb, var(--accent-ink) 72%, transparent)}
.legend{grid-column:3; justify-self:end; border-radius:16px; padding:12px 14px; width:288px; font-size:12.5px; color:var(--ink-2)}
#ui.panel-open .legend{width:230px} #ui.panel-open .legend .lrow,#ui.panel-open .legend label,#ui.panel-open .legend .hsc{display:none}
.legend h3{margin:0 0 6px; font-size:13px; font-weight:600; color:var(--ink)}
.legend .lrow{display:flex; gap:8px; align-items:center; margin:3px 0}
.legend .ico{flex:none; width:16px; text-align:center; color:var(--ink-3)}
.ramp{height:8px; border-radius:4px; margin:8px 0 4px}
.rampl{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); direction:ltr}
.hsc{display:inline-flex; gap:2px; padding:2px; border-radius:9px; background:var(--line); margin:5px 0 3px}
.hsc button{font-size:11.5px; padding:2px 10px; border-radius:7px; color:var(--ink-2)}
.hsc button[aria-pressed="true"]{background:var(--glass-strong); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend label{display:flex; align-items:center; gap:7px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; cursor:pointer}
.legend input{accent-color:var(--accent); margin:0}

/* ---------- company panel ---------- */
#panel{position:fixed; z-index:20; top:calc(var(--gt) + 70px); bottom:var(--gb); left:var(--gx-l); width:var(--pw); border-radius:22px; display:flex; flex-direction:column; overflow:hidden; background:var(--glass-strong); transform:translateX(calc(-100% - 40px)); transition:transform .45s cubic-bezier(.2,.8,.2,1); visibility:hidden}
#panel.open{transform:none; visibility:visible}
.p-head{padding:16px 18px 0; flex:none}
.crumbs{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3); margin-bottom:8px; min-width:0}
.crumbs button{color:var(--ink-2); font-weight:500; white-space:nowrap}
.crumbs button:hover{color:var(--accent)}
.crumbs .street{direction:ltr; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.p-x{margin-inline-start:auto; display:flex; gap:4px}
.p-x button{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:var(--ink-2)}
.p-x button:hover{background:var(--line)}
.p-x button[aria-pressed="true"]{color:var(--beacon)}
.p-id{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.p-id .tkr{font-family:var(--font-data); font-size:30px; font-weight:700; line-height:1}
.p-id .nm{font-size:14px; color:var(--ink-2)}
.p-id .alts{font-family:var(--font-data); font-size:11.5px; color:var(--ink-3)}
.p-px{display:flex; align-items:baseline; gap:10px; margin-top:9px; flex-wrap:wrap}
.p-px .px{font-size:24px; font-weight:600}

function wireBody(js, c){

    const calc = () => {
      const v = id => parseFloat(String($('#' + id).value).replace(/[^0-9.\-]/g, ''));
      const port = v('cPort'), risk = v('cRisk'), en = v('cEntry'), sp = v('cStop'), tg = v('cTgt');
      store.set(LS_PREFIX + 'port', isFinite(port) ? port : 100000); store.set(LS_PREFIX + 'risk', isFinite(risk) ? risk : 1);
      const res = $('#cRes'), warn = $('#cWarn');
      if (![port, risk, en, sp, tg].every(isFinite) || en <= sp || port <= 0 || risk <= 0) { res.innerHTML = ''; warn.textContent = 'הסטופ צריך להיות מתחת למחיר הכניסה, וכל השדות מספרים חיוביים.'; return; }
      const per = en - sp, shares = Math.floor(port * risk / 100 / per), pos = shares * en, pct = pos / port * 100, rr = (tg - en) / per;
      res.innerHTML = `<div><span>מניות</span><b class="num">${shares.toLocaleString('en-US')}</b></div><div><span>סכום</span><b class="num">${fmtUsd(pos, 0)}</b></div><div><span>מהתיק</span><b class="num">${pct.toFixed(1)}%</b></div><div><span>סיכוי/סיכון</span><b class="num ${rr >= 2 ? 'up' : rr < 1 ? 'down' : ''}">1:${Math.max(0, rr).toFixed(1)}</b></div>`;
      const sectorW = C.filter(o => o.si === c.si && o.hold).reduce((a, o) => a + (o.hold.w || 0), 0);
      warn.textContent = pct > 20 ? `הפוזיציה תהיה ${pct.toFixed(0)}% מהתיק. מעל 20% זה ריכוז גבוה.` : sectorW + pct > 35 ? `יחד עם ההחזקות הקיימות, החשיפה לאי ${SECTORS[c.si].he} תגיע ל-${(sectorW + pct).toFixed(0)}%.` : '';

function demoClock(){

  const ny = f('America/New_York', { hour: '2-digit', minute: '2-digit', hour12: false }); const il = f('Asia/Jerusalem', { hour: '2-digit', minute: '2-digit', hour12: false });
  const wd = f('America/New_York', { weekday: 'short' }); const [h, m] = ny.split(':').map(Number); const t = h * 60 + m;
  const state = wd === 'Sat' || wd === 'Sun' ? 'closed' : t >= 570 && t < 960 ? 'open' : t >= 240 && t < 570 ? 'pre' : t >= 960 && t < 1200 ? 'post' : 'closed';
  Object.assign(CITY.session, { ny, il, state });
}

  if (e.key === 'Escape') { if (!sEl.hidden) closeSearch(); else if (!$('#brief').hidden) $('#brief').hidden = true; else if (!$('#tline').hidden) $('#tline').hidden = true; else if (!$('#drawer').hidden) $('#drawer').hidden = true; else if (!$('#statusPop').hidden) $('#statusPop').hidden = true; else if (selI >= 0) closePanel(); else if (focusD) goHome(); return; }

  else if (['1', '2', '3', '4'].includes(e.key)) setMode(MODES[+e.key - 1].k);

});

/* camera buttons */
function zoomBy(f){ const s = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)); flyTo(controls.target.clone(), clamp(s.radius * f, controls.minDistance, controls.maxDistance), { dur: 420 }); }
$('#zIn').onclick = () => zoomBy(0.62); $('#zOut').onclick = () => zoomBy(1.6); $('#home').onclick = goHome;
$('#rotate').onclick = () => { const s = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)); flyTo(controls.target.clone(), s.radius, { az: s.theta + Math.PI / 2, dur: 900 }); };
$('#flat').onclick = () => {
  const on = HS.to > 0.5; HS.from = HS.v; HS.to = on ? 0.05 : 1; HS.t0 = performance.now(); $('#flat').setAttribute('aria-pressed', on);
  const s = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  flyTo(controls.target.clone(), s.radius, on ? { polar: 0.02, az: 0, dur: 900 } : { polar: 0.9, az: -Math.PI / 4, dur: 900 }); controls.enableRotate = !on;
};
$('#themeBtn').onclick = () => { const next = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store.set(LS_PREFIX + 'theme', next); readTheme(); renderRail(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!store.get(LS_PREFIX + 'theme', null)) { readTheme(); renderRail(); } });

/* live refresh */
let lastQuoteTs = null;
async function pollQuotes(){
  if (DEMO || !CITY) return;
  try {
    const q = await api('/api/quotes' + (lastQuoteTs ? '?since=' + encodeURIComponent(lastQuoteTs) : '')); lastQuoteTs = q.now; CITY.session = q.session;
    let n = 0; for (const [t, [px, chg]] of Object.entries(q.quotes)) { const c = byT[t]; if (!c || !isNum(chg)) continue; c.px = px; c.chg = chg; if (isNum(c.std) && c.std) c.sig = chg / c.std; n++; }
    if (n) { if (mode === 'market') { for (const c of C) colorFor(c, mode, tgt[c.i].col); for (const c of C) { from[c.i].h = cur[c.i].h; from[c.i].col.copy(cur[c.i].col); } anim = { t0: performance.now(), dur: 600 }; } renderStrip(); renderRail(); }
  } catch {}
}
async function refreshCity(){
  if (DEMO) return;
  try { const city = await api('/api/city'); for (const r of city.companies) { const c = byT[r.t]; if (c) Object.assign(c, r); } CITY.alerts = city.alerts; CITY.index = city.index; CITY.session = city.session; CITY.sector_etf = city.sector_etf; CITY.mode = city.mode; retarget(); renderStrip(); renderRail(); dirty = true; } catch {}
}

/* ================= picking events ================= */
function wirePointer(){
  const cv = renderer.domElement;
  cv.addEventListener('pointermove', e => { pointer = { x: e.clientX, y: e.clientY }; needPick = true; if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) dragging = true; });
  cv.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; dragging = false; fly = null; $('#drawer').hidden = true; $('#statusPop').hidden = true; });
  cv.addEventListener('pointerup', e => { if (downAt && !dragging && e.button === 0) { const h = pick(e.clientX, e.clientY); if (h.b !== undefined) select(h.b); else if (h.d) focusDistrict(h.d); } downAt = null; dragging = false; });
  cv.addEventListener('pointerleave', () => { pointer = null; setHover(-1); });
  controls.addEventListener('change', () => { dirty = true; });
}

/* ================= loop & boot ================= */
const clock = new THREE.Clock(); let lastT = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  stepAnim(now); stepFly(now);
  if (HS.t0 !== undefined) { const k = ease(clamp((now - HS.t0) / (reduceMotion ? 1 : 850), 0, 1)); HS.v = lerp(HS.from, HS.to, k); writeAll(); if (k >= 1) HS.t0 = undefined; }
  const vk = VO.to - VO.v; if (Math.abs(vk) > 0.001) { VO.v += vk * (reduceMotion ? 1 : 1 - Math.exp(-dt * 9)); applyView(); dirty = true; } else if (VO.v !== VO.to) { VO.v = VO.to; applyView(); }
  if (!fly) controls.update();
  const tg = controls.target; const cx = clamp(tg.x, -WORLD.w / 2, WORLD.w / 2), cz = clamp(tg.z, -WORLD.d / 2, WORLD.d / 2);
  if (cx !== tg.x || cz !== tg.z) { camera.position.x += cx - tg.x; camera.position.z += cz - tg.z; tg.x = cx; tg.z = cz; }
  const et = clock.getElapsedTime();
  BEAM.a += (BEAM.target - BEAM.a) * 0.08; beamMat.uniforms.uAlpha.value = BEAM.a * (dark ? 1.1 : 0.85); haloMat.uniforms.uAlpha.value = BEAM.a * (dark ? 0.32 : 0.22); beamMat.uniforms.uTime.value = haloMat.uniforms.uTime.value = et; beams.visible = halo.visible = BEAM.a > 0.01;
  routeMat.uniforms.uTime.value = et;
  if (frameMesh && frameMesh.visible) frameMat.opacity = 0.55 + 0.35 * Math.sin(now / 380);
  stepCars(dt);
  if (needPick && pointer && !dragging && !fly && sEl.hidden) { needPick = false; const h = pick(pointer.x, pointer.y); setHover(h.b ?? -1); }
  if (dirty) { updateLabels(); dirty = false; }
  renderer.render(scene, camera);
}
async function boot(){
  const t = store.get(LS_PREFIX + 'theme', null); if (t) document.documentElement.setAttribute('data-theme', t); if (store.get(LS_PREFIX + 'cb', false)) document.documentElement.classList.add('cb');
  let city;
  try { city = await api('/api/city'); }
  catch (e) { $('#app').insertAdjacentHTML('beforeend', `<div id="fail"><div><b>השרת לא זמין</b><br>${esc(e.message)}<br><br>הפעל אותו עם: metro run</div></div>`); return; }
  buildData(city); fitSun();
  cur = C.map(() => ({ h: 0, col: new THREE.Color() })); from = C.map(() => ({ h: 0, col: new THREE.Color() })); tgt = C.map(() => ({ h: 1, col: new THREE.Color() }));
  buildScene(); buildLabels(); wirePointer();
  buildModes(); renderLegend(); renderStrip(); renderRail(); loadStatus();
  resize();
  { const H = HOME(); if (reduceMotion) setCam(H.t, H.dist, H.polar, H.az); else { setCam(H.t, H.dist * 1.3, 0.55, H.az + 0.5); flyTo(H.t, H.dist, { polar: H.polar, az: H.az, dur: 2100 }); } }
  readTheme(); introT0 = performance.now(); if (!reduceMotion) for (const c of C) cur[c.i].h = 0; writeAll();
  requestAnimationFrame(frame);
  requestAnimationFrame(() => { const b = $('#boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 700); });
  if (!DEMO) { setInterval(pollQuotes, 20000); setInterval(refreshCity, 120000); setInterval(loadStatus, 60000); }
  setInterval(() => { if (!DEMO) return; renderStrip(); }, 30000);
  const hashT = decodeURIComponent(location.hash.slice(1)).toUpperCase(); if (hashT && byT[hashT]) setTimeout(() => select(byT[hashT].i), 2300);
  window.__metro = { get C(){ return C; }, setHScale, where: t => { const c = byT[t]; return { p: proj(c.x, c.topY, c.z), view: { ...camera.view }, aspect: camera.aspect, dist: camera.position.distanceTo(controls.target), tgt: controls.target.toArray(), VO: { ...VO } }; }, select, setMode, focusDistrict, closePanel, goHome, openSearch, openBrief, get mode(){ return mode; }, setTab: t => { panelTab = t; if (CO) renderPanel(); } };
}
boot();
