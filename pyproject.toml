[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metropolin"
version = "0.2.0"
description = "Personal 3D market city: SEC filings, IBKR portfolio, Claude report cards, scoring and alerts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "apscheduler>=3.10,<4",
  "typer>=0.12",
  "anthropic>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
ibkr = ["ib_async>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
metro = "metro.cli:app"

[tool.setuptools.packages.find]
include = ["metro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
